name: Keep-alive Radar de Concorrentes

# O plano gratuito do Render "dorme" após 15 min sem acessos e leva ~50 s para
# acordar. Este ping a cada 10 min mantém o portal sempre rápido.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /healthz
        run: curl -fsS --retry 3 --retry-delay 10 --max-time 90 https://projetos-do-ernani.onrender.com/healthz
