name: Varredura semanal de concorrentes

# Roda automaticamente todo sábado às 11:00 UTC (08:00 no horário de Brasília)
# e permite disparo manual pela aba Actions do GitHub.
on:
  schedule:
    - cron: "0 11 * * 6"
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar varredura
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          EMAIL_TO: ${{ vars.EMAIL_TO }}
        run: python scripts/run_scan.py

      - name: Salvar banco de dados atualizado
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: atualiza radar.db com novos artigos processados"
          file_pattern: "data/radar.db"
