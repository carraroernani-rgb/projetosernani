services:
  - type: web
    name: radar-concorrentes
    runtime: python
    plan: free
    rootDir: partner-content-radar
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
